<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1400px;
      height: 400px;
      background: #090d16;
      display: flex;
      align-items: center;
      padding: 0 80px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 48px;
    }
    .icon-box {
      width: 180px;
      height: 180px;
    }
    .text-box {
      display: flex;
      flex-direction: column;
    }
    .brand-title {
      font-size: 110px;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #ffffff;
      line-height: 1;
    }
    .brand-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 26px;
      font-weight: 800;
      color: #10b981;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .beacon {
      width: 12px;
      height: 12px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 12px #10b981;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <svg class="icon-box" viewBox="0 0 1024 1024">
      <defs>
        <linearGradient id="vGradW" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#94a3b8"/>
        </linearGradient>
        <filter id="neonGlowW">
          <feGaussianBlur stdDeviation="20" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <path d="M 240 220 L 400 220 L 512 680 L 420 680 Z" fill="url(#vGradW)"/>
      <path d="M 784 220 L 624 220 L 512 680 L 604 680 Z" fill="url(#vGradW)"/>
      <circle cx="512" cy="630" r="50" fill="#10b981" filter="url(#neonGlowW)"/>
      <circle cx="512" cy="630" r="22" fill="#ffffff"/>
    </svg>
    <div class="text-box">
      <div class="brand-title">Vance</div>
      <div class="brand-sub"><div class="beacon"></div>Autonomous B2B SDR • usevance.com</div>
    </div>
  </div>
</body>
</html>
